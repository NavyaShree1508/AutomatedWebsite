name: Automated Docker Deployment

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t automated-website .

      - name: Run Docker Container
        run: |
          docker run -d -p 8080:80 --name automated-website-container automated-website

      - name: Check Container
        run: docker ps
