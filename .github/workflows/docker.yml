name: Automated Docker Deployment

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mywebsite .

      - name: Stop old container
        shell: powershell
        run: |
          docker stop mywebsite-container 2>$null
          docker rm mywebsite-container 2>$null

      - name: Start new container
        run: docker run -d -p 8080:80 --name mywebsite-container mywebsite

      - name: Deployment successful
        run: docker ps