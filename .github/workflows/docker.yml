name: Docker Website Deployment

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull Docker image with retry
        run: |
          for i in 1 2 3 4 5
          do
            docker pull nginx:alpine && break
            echo "Retrying Docker Hub connection..."
            sleep 10
          done

      - name: Build Docker Image
        run: docker build -t mywebsite .